name: Build dlib wheel for Linux

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libopenblas-dev \
            liblapack-dev \
            libx11-dev \
            python3-dev \
            pkg-config

      - name: Build dlib wheel
        run: |
          pip install wheel setuptools
          export CMAKE_ARGS="-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          pip wheel dlib==19.24.6 \
            --wheel-dir backend/wheels/ \
            --no-cache-dir

      - name: Commit wheel to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backend/wheels/
          git commit -m "add linux dlib wheel"
          git push