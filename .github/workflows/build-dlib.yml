name: Build dlib wheel for Linux

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libopenblas-dev \
            liblapack-dev \
            libx11-dev \
            python3-dev \
            pkg-config

          # Downgrade cmake to version that supports old policies
          pip install cmake==3.25.0

      - name: Clone and patch dlib
        run: |
          git clone --depth 1 --branch v19.24.4 https://github.com/davisking/dlib.git
          
          # Patch CMakeLists.txt to fix cmake version issue
          sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.5)/' dlib/CMakeLists.txt
          sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.5)/' dlib/dlib/external/pybind11/CMakeLists.txt
          sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' dlib/dlib/external/pybind11/CMakeLists.txt

      - name: Build wheel
        run: |
          pip install wheel setuptools
          cd dlib
          python setup.py bdist_wheel --dist-dir ../backend/wheels/

      - name: Verify wheel was created
        run: |
          ls -la backend/wheels/
          echo "Wheel built successfully"

      - name: Commit wheel to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backend/wheels/
          git commit -m "add prebuilt linux dlib wheel"
          git push